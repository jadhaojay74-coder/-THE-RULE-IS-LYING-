<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RULE IS LYING</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="app-container">
        <header class="game-header">
            <h1 class="game-title">THE RULE IS LYING</h1>
            <button id="theme-toggle-btn" class="btn secondary">Toggle Theme</button>
        </header>

        <section class="game-status">
            <div id="level-display" class="stat">Level: <span id="level-val">1</span></div>
            <div id="timer-display" class="stat">Time: <span id="timer-val">--</span></div>
            <div id="bias-display" class="stat">AI Assessment: <span id="bias-val">Profiling...</span></div>
        </section>

        <main class="puzzle-wrapper">
            <div id="instruction-box" class="instruction">Select the object that does not belong.</div>
            <div id="puzzle-grid" class="puzzle-grid"></div>
            <div id="feedback-msg" class="feedback"></div>
        </main>

        <footer class="game-footer">
            <button id="next-btn" class="btn primary" disabled>NEXT</button>
        </footer>
    </div>

    <script src="js/ai-profiler.js"></script>
    <script src="js/rule-generator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
